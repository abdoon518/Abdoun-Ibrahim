<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Amiri;font-weight:400;src:url(fonts/amiri-arabic-400-normal.woff2)}
@font-face{font-family:Amiri;font-weight:700;src:url(fonts/amiri-arabic-700-normal.woff2)}
@font-face{font-family:Tajawal;font-weight:400;src:url(fonts/tajawal-arabic-400-normal.woff2)}
@font-face{font-family:Tajawal;font-weight:500;src:url(fonts/tajawal-arabic-500-normal.woff2)}
@font-face{font-family:Tajawal;font-weight:700;src:url(fonts/tajawal-arabic-700-normal.woff2)}
:root{--bg:#f5f0e6;--ink:#2b241c;--muted:#7a6a55;--gold:#b88a2e;--gold2:#d9b25f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(ellipse 900px 700px at 30% 55%, #fbf7ef 0%, var(--bg) 60%, #ece4d4 100%)}
.abs{position:absolute}
.frame{position:absolute;inset:48px;border:1.5px solid rgba(184,138,46,.35)}
/* intro */
#introLine{left:50%;top:560px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:translateX(-50%);width:0}
#introLabel{width:100%;text-align:center;top:440px;font:500 64px Tajawal;color:var(--ink)}
#introSub{width:100%;text-align:center;top:590px;font:400 34px Tajawal;color:var(--muted)}
/* jacket */
#jacketWrap{left:180px;top:150px;width:780px;height:780px}
#glow{left:230px;top:180px;width:680px;height:680px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,178,95,.28) 0%,rgba(217,178,95,0) 65%)}
#shadow{left:340px;top:900px;width:460px;height:40px;border-radius:50%;background:radial-gradient(ellipse,rgba(60,40,10,.22),rgba(60,40,10,0) 70%)}
/* right side text */
.right{right:190px;width:760px;text-align:right}
#tag{top:300px;font:500 32px Tajawal;color:var(--gold)}
#title{top:350px;font:700 132px/1.25 Amiri;color:var(--ink)}
#titleLine{top:545px;right:190px;height:3px;background:linear-gradient(270deg,var(--gold),rgba(184,138,46,0));width:0}
#subtitle{top:580px;font:400 40px Tajawal;color:var(--muted)}
.feat{display:flex;align-items:center;gap:28px;justify-content:flex-start;flex-direction:row}
.dot{width:74px;height:74px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.feat .t{font:500 54px Tajawal;color:var(--ink)}
.feat .s{font:400 30px Tajawal;color:var(--muted);margin-top:6px}
#featHead{top:250px;font:700 84px Amiri;color:var(--ink)}
#f1{top:420px}
#f2{top:580px}
/* CTA */
#ctaTitle{top:340px;font:700 120px/1.2 Amiri;color:var(--ink)}
#ctaSub{top:530px;font:400 40px Tajawal;color:var(--muted)}
#ctaBtn{top:640px;right:190px;padding:22px 70px;border-radius:999px;background:linear-gradient(135deg,#c99a3c,#e6c372 50%,#b4862d);
  font:700 46px Tajawal;color:#2b1f0c;box-shadow:0 14px 40px rgba(150,110,30,.28);overflow:hidden}
#btnShine{position:absolute;top:0;bottom:0;width:120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg)}
</style>
</head>
<body>
<div id="stage">
  <div class="frame" id="frame"></div>

  <div class="abs" id="introLabel">تشكيلة الموسم الجديد</div>
  <div class="abs" id="introLine"></div>
  <div class="abs" id="introSub">قطعة واحدة… تغيّر الإطلالة</div>

  <div class="abs" id="glow"></div>
  <div class="abs" id="shadow"></div>
  <svg class="abs" id="jacketWrap" viewBox="0 0 600 600">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8f6b26"/>
        <stop offset=".25" stop-color="#e9c977"/>
        <stop offset=".45" stop-color="#b98f3e"/>
        <stop offset=".65" stop-color="#f2da95"/>
        <stop offset="1" stop-color="#8a6624"/>
      </linearGradient>
      <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9a7430"/>
        <stop offset="1" stop-color="#6f5019"/>
      </linearGradient>
      <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".22"/>
        <stop offset=".3" stop-color="#000" stop-opacity="0"/>
        <stop offset=".7" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".25"/>
      </linearGradient>
      <pattern id="rib" width="6" height="6" patternUnits="userSpaceOnUse">
        <rect width="6" height="6" fill="url(#goldDark)"/>
        <rect width="2" height="6" fill="#000" opacity=".18"/>
      </pattern>
      <clipPath id="jclip">
        <path d="M205 125 C170 135 150 160 140 210 L112 420 L168 430 L196 250 Z"/>
        <path d="M395 125 C430 135 450 160 460 210 L488 420 L432 430 L404 250 Z"/>
        <path d="M205 125 L260 105 Q300 135 340 105 L395 125 L404 250 L408 452 L192 452 L196 250 Z"/>
        <rect x="190" y="448" width="220" height="36" rx="8"/>
        <path d="M112 418 L168 428 L164 462 L106 452 Z"/>
        <path d="M488 418 L432 428 L436 462 L494 452 Z"/>
        <path d="M250 86 Q300 128 350 86 L342 102 Q300 142 258 102 Z"/>
      </clipPath>
      <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g id="jacket">
      <!-- sleeves -->
      <path d="M205 125 C170 135 150 160 140 210 L112 420 L168 430 L196 250 Z" fill="url(#gold)"/>
      <path d="M395 125 C430 135 450 160 460 210 L488 420 L432 430 L404 250 Z" fill="url(#gold)"/>
      <path d="M205 125 C170 135 150 160 140 210 L112 420 L168 430 L196 250 Z" fill="url(#shade)"/>
      <path d="M395 125 C430 135 450 160 460 210 L488 420 L432 430 L404 250 Z" fill="url(#shade)"/>
      <!-- cuffs -->
      <path d="M112 418 L168 428 L164 462 L106 452 Z" fill="url(#rib)"/>
      <path d="M488 418 L432 428 L436 462 L494 452 Z" fill="url(#rib)"/>
      <!-- body -->
      <path d="M205 125 L260 105 Q300 135 340 105 L395 125 L404 250 L408 452 L192 452 L196 250 Z" fill="url(#gold)"/>
      <path d="M205 125 L260 105 Q300 135 340 105 L395 125 L404 250 L408 452 L192 452 L196 250 Z" fill="url(#shade)" opacity=".8"/>
      <!-- seams -->
      <path d="M196 250 L205 125" stroke="#6f5019" stroke-width="2" opacity=".5" fill="none"/>
      <path d="M404 250 L395 125" stroke="#6f5019" stroke-width="2" opacity=".5" fill="none"/>
      <!-- hem -->
      <rect x="190" y="448" width="220" height="36" rx="8" fill="url(#rib)"/>
      <!-- collar -->
      <path d="M250 86 Q300 128 350 86 L342 102 Q300 142 258 102 Z" fill="url(#rib)"/>
      <!-- zipper -->
      <line x1="300" y1="128" x2="300" y2="484" stroke="#5b4114" stroke-width="3"/>
      <line x1="300" y1="128" x2="300" y2="484" stroke="#f6e3a8" stroke-width="1" stroke-dasharray="2 4" opacity=".8"/>
      <rect x="295" y="150" width="10" height="22" rx="3" fill="#f6e3a8" stroke="#5b4114" stroke-width="1.5"/>
      <!-- pockets -->
      <path d="M228 330 L246 400" stroke="#5b4114" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <path d="M372 330 L354 400" stroke="#5b4114" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <!-- shine -->
      <g clip-path="url(#jclip)">
        <rect id="shine" x="-200" y="0" width="120" height="600" fill="url(#shineGrad)" transform="skewX(-18)"/>
      </g>
    </g>
  </svg>

  <!-- scene 2 -->
  <div class="abs right" id="tag">جديد</div>
  <div class="abs right" id="title">الجاكيت الذهبي</div>
  <div class="abs" id="titleLine"></div>
  <div class="abs right" id="subtitle">إطلالة راقية تلفت الأنظار</div>

  <!-- scene 3 -->
  <div class="abs right" id="featHead">ما يميّزه</div>
  <div class="abs right feat" id="f1">
    <div class="dot"><svg width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="11" fill="url(#gold)" stroke="#b88a2e" stroke-width="2"/></svg></div>
    <div><div class="t">لون ذهبي لامع</div><div class="s">يبرز حضورك في كل مناسبة</div></div>
  </div>
  <div class="abs right feat" id="f2">
    <div class="dot"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#b88a2e" stroke-width="2.4" stroke-linecap="round"><circle cx="14" cy="12" r="5"/><path d="M5 34 C5 24 23 24 23 34"/><circle cx="27" cy="12" r="5"/><path d="M22 22 C30 21 36 26 36 34"/></svg></div>
    <div><div class="t">يناسب الرجال والنساء</div><div class="s">تصميم واحد يليق بالجميع</div></div>
  </div>

  <!-- scene 4 -->
  <div class="abs right" id="ctaTitle">كن أول من يرتديه</div>
  <div class="abs right" id="ctaSub">الجاكيت الذهبي متوفر بكميات محدودة</div>
  <div class="abs" id="ctaBtn">اطلب الآن<span id="btnShine"></span></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const easeOut = x => 1-Math.pow(1-x,3);
const easeInOut = x => x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
// progress of t within [a,b], eased
const p = (t,a,b,e=easeOut)=>e(clamp((t-a)/(b-a)));
// fade in at [a,a+d], out at [b,b+d]; with rise in px
function show(el,t,a,b,{d=.7,rise=24,out=.5}={}){
  const i=p(t,a,a+d), o=b==null?0:p(t,b,b+out,easeInOut);
  const v=i*(1-o);
  el.style.opacity=v;
  el.style.transform=`translateY(${(1-i)*rise - o*12}px)`;
}

window.seek = function(t){
  // frame border
  $('frame').style.opacity = p(t,0,1.2)*0.9;

  // Scene 1: intro (0 - 3)
  show($('introLabel'),t,0.3,2.5,{d:.9});
  show($('introSub'),t,1.0,2.5,{d:.9});
  const lw = p(t,0.5,1.7,easeInOut)*(1-p(t,2.4,2.9,easeInOut));
  $('introLine').style.width = (lw*620)+'px';

  // Jacket (2.8 - 15)
  const ji = p(t,2.8,4.2);
  // position: left in scenes 2-3, slides a bit in scene 4
  const jx = -60*(1-ji);
  const floatY = Math.sin((t-2.8)*1.1)*6;
  const js = 0.92+0.08*ji;
  const jw = $('jacketWrap');
  jw.style.opacity = ji;
  jw.style.transform = `translate(${jx}px,${floatY}px) scale(${js})`;
  $('glow').style.opacity = ji;
  $('shadow').style.opacity = ji*(1 - floatY/40);
  // shine sweeps
  const s1 = p(t,4.6,6.0,easeInOut), s2 = p(t,12.2,13.4,easeInOut);
  const sx = (t<9? -200 + s1*900 : -200 + s2*900);
  $('shine').setAttribute('x', sx);

  // Scene 2: title (3.2 - 7.4)
  show($('tag'),t,3.3,7.2);
  show($('title'),t,3.6,7.2,{d:.9,rise:30});
  const tl = p(t,4.2,5.2,easeInOut)*(1-p(t,7.2,7.7,easeInOut));
  $('titleLine').style.width=(tl*420)+'px';
  show($('subtitle'),t,4.6,7.2);

  // Scene 3: features (7.6 - 11.4)
  show($('featHead'),t,7.7,11.2);
  show($('f1'),t,8.2,11.2,{rise:30});
  show($('f2'),t,9.0,11.2,{rise:30});

  // Scene 4: CTA (11.6 - 15)
  show($('ctaTitle'),t,11.6,null,{d:.9,rise:30});
  show($('ctaSub'),t,12.1,null);
  const bi=p(t,12.5,13.2);
  $('ctaBtn').style.opacity=bi;
  $('ctaBtn').style.transform=`scale(${0.94+0.06*bi})`;
  $('btnShine').style.left = (-160 + p(t,13.4,14.3,easeInOut)*560)+'px';

  // final soft fade
  $('stage').style.opacity = 1 - p(t,14.55,15,easeInOut)*0.0;
};
window.seek(0);
</script>
</body>
</html>
