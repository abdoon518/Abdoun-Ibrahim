<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:DMSerif;src:url(fonts/dm-serif-display-latin-400-normal.woff2)}
@font-face{font-family:DMSerif;font-style:italic;src:url(fonts/dm-serif-display-latin-400-italic.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
:root{--pink:#f6d3de;--pink2:#efb7c9;--rose:#c2577e;--cream:#fff6ee;--ink:#5a2a3c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--pink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(ellipse 80% 60% at 50% 35%,var(--cream) 0%,var(--pink) 70%,var(--pink2) 100%)}
.layer{position:absolute;inset:0;overflow:hidden}
.ph{filter:saturate(1.02) contrast(.97) brightness(1.03) sepia(.08)}
.card{position:absolute;left:90px;top:520px;width:900px;height:1200px;border-radius:44px;overflow:hidden;
  box-shadow:0 30px 80px rgba(150,60,90,.25);border:10px solid #fff}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,214,228,.18),rgba(255,240,230,.10));mix-blend-mode:soft-light;pointer-events:none}
.full img{position:absolute;display:block}
.fade{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(0deg,rgba(246,211,222,.96) 18%,rgba(246,211,222,0));}
.h{font-family:DMSerif;color:var(--ink);text-align:center;line-height:1.05}
#t1{position:absolute;left:60px;right:60px;top:600px}
#t1 .l{font:400 150px/1.02 DMSerif;color:var(--ink);text-align:center}
#t1 .l.it{font-style:italic;color:var(--rose)}
#t2{position:absolute;left:60px;right:60px;top:200px;text-align:center}
#t2 .a{font:400 104px/1.05 DMSerif;color:var(--ink)}
#t2 .a i{color:var(--rose)}
#t3{position:absolute;left:60px;right:60px;bottom:250px;text-align:center;z-index:5}
#t3 .a{font:400 108px/1.05 DMSerif;color:var(--ink)}
#t3 .a i{color:var(--rose)}
.tile{position:absolute;border-radius:34px;overflow:hidden;border:8px solid #fff;box-shadow:0 18px 50px rgba(150,60,90,.22)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
#t4{position:absolute;left:40px;right:40px;top:1470px;text-align:center}
#t4a{font:italic 400 100px/1.1 DMSerif;color:var(--ink)}
#t4b{position:absolute;left:0;right:0;top:0;text-align:center}
#t4b .a{font:400 104px/1.05 DMSerif;color:var(--ink)}
#pill{display:inline-block;margin-top:28px;padding:20px 48px;border-radius:999px;background:var(--rose);color:#fff;font:800 44px Inter;letter-spacing:1px;box-shadow:0 12px 30px rgba(194,87,126,.35)}
#hearts{position:absolute;inset:0;pointer-events:none;z-index:8}
#hearts span{position:absolute;color:#fff;opacity:.8;text-shadow:0 2px 10px rgba(194,87,126,.25)}
#sparkle{position:absolute;inset:0;z-index:9;background:#fff;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <!-- 0-3 intro -->
  <div class="layer" id="intro">
    <div id="t1"><div class="l" id="l1">GIRL,</div><div class="l it" id="l2">you need a</div><div class="l" id="l3">NEW JACKET 🎀</div></div>
  </div>
  <!-- 3-8 cardigan -->
  <div class="layer" id="s1"><div class="card"><img class="ph" src="img/k1.jpg"><div class="tint"></div></div></div>
  <div class="layer" id="s2"><div class="card"><img class="ph" src="img/k4.jpg"><div class="tint"></div></div></div>
  <div id="t2"><div class="a" id="t2a">Cute styles,<br><i>endless outfits.</i></div></div>
  <!-- 8-14 varsity + details -->
  <div class="layer" id="s3"><div class="card"><img class="ph" src="img/p1.jpg"><div class="tint"></div></div></div>
  <div class="layer full" id="s4"><img class="ph" src="img/p3.jpg"><div class="fade"></div></div>
  <div class="layer full" id="s5"><img class="ph" src="img/k4.jpg"><div class="fade"></div></div>
  <div id="t3"><div class="a" id="t3a">Find your next<br><i>favorite piece ♡</i></div></div>
  <!-- 14-20 all together -->
  <div class="layer" id="outro">
    <div class="tile" id="o1" style="left:50px;top:150px;width:470px;height:627px"><img class="ph" src="img/k1.jpg"></div>
    <div class="tile" id="o2" style="left:560px;top:150px;width:470px;height:627px"><img class="ph" src="img/p1.jpg"></div>
    <div class="tile" id="o3" style="left:50px;top:807px;width:470px;height:627px"><img class="ph" src="img/k2.jpg"></div>
    <div class="tile" id="o4" style="left:560px;top:807px;width:470px;height:627px"><img class="ph" src="img/p2.jpg"></div>
    <div id="t4"><div id="t4a">Your next outfit is waiting…</div>
      <div id="t4b"><div class="a">SHOP OUR eBay STORE 💌</div><div id="pill">USERNAME: abnj-11</div></div></div>
  </div>
  <div id="hearts"></div>
  <div id="sparkle"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const p=(t,a,b,e=eio)=>e(clamp((t-a)/(b-a)));
// visible window with smooth crossfades
const vis=(t,a,b,f=.5)=>p(t,a-f/2,a+f/2)*(1-p(t,b-f/2,b+f/2));
function rise(el,t,a,d=.7,dy=40){const k=p(t,a,a+d,eo);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`;return k;}
function crop(layer,IW,IH,cx,cy,w){const s=1080/w,vh=1920/s;cx=clamp(cx,w/2,IW-w/2);cy=clamp(cy,vh/2,IH-vh/2);
  const im=layer.querySelector('img');im.style.width=IW*s+'px';im.style.height=IH*s+'px';im.style.left=(540-cx*s)+'px';im.style.top=(960-cy*s)+'px';}
// floating hearts (deterministic)
const H=[];let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
for(let i=0;i<16;i++){const s=document.createElement('span');s.textContent=rnd()<.5?'♡':'✦';$('hearts').appendChild(s);
  H.push({el:s,x:rnd()*1000+20,y:rnd()*1920,v:20+rnd()*35,sz:26+rnd()*40,ph:rnd()*6.28});}
window.seek=function(t){
  for(const h of H){const y=((h.y-h.v*t)%2100+2100)%2100-90;h.el.style.left=(h.x+Math.sin(t*.8+h.ph)*18)+'px';h.el.style.top=y+'px';
    h.el.style.fontSize=h.sz+'px';h.el.style.opacity=(.35+.35*Math.sin(t*1.5+h.ph))*(t<14?1:.7);}
  // intro
  const vi=1-p(t,2.7,3.3); $('intro').style.opacity=vi; $('intro').style.display=vi>0?'block':'none';
  if(vi>0){rise($('l1'),t,.2);rise($('l2'),t,.7);rise($('l3'),t,1.2);$('t1').style.transform=`scale(${1+.04*p(t,0,3,x=>x)})`;}
  // cards 3-8
  const sh=[['s1',3,5.5],['s2',5.5,8],['s3',8,10]];
  for(const [id,a,b] of sh){const v=vis(t,a,b);$(id).style.opacity=v;$(id).style.display=v>0?'block':'none';
    if(v>0){const k=clamp((t-a+.25)/(b-a+.5));$(id).querySelector('.card').style.transform=`scale(${.96+.06*k}) rotate(${(k-.5)*1.2}deg)`;}}
  const v2=vis(t,3,8); $('t2').style.opacity=v2; if(v2>0)rise($('t2a'),t,3.2,.8,30);
  if(t>=3&&t<8)$('t2').style.opacity=Math.min(v2,$('t2a').style.opacity);
  // detail close-ups 10-14
  const fs=[['s4',10,12,1932,2576,840,1480,1250,1000],['s5',12,14,1932,2576,560,1159,1100,900]];
  for(const [id,a,b,IW,IH,cx,cy,w0,w1] of fs){const v=vis(t,a,b);$(id).style.opacity=v;$(id).style.display=v>0?'block':'none';
    if(v>0){const k=clamp((t-a+.25)/(b-a+.5));crop($(id),IW,IH,cx,cy,w0+(w1-w0)*eio(k));}}
  const v3=vis(t,8,14); $('t3').style.display=v3>0?'block':'none'; $('t3').style.opacity=v3;
  if(v3>0){rise($('t3a'),t,8.3,.8,30); $('t3').style.top=''; }
  // during card shot at 8-10, keep text at top so it doesn't cover the card
  $('t3').style.bottom=(t<10)?'auto':'250px'; $('t3').style.top=(t<10)?'200px':'auto';
  // outro
  const vo=p(t,13.75,14.25); $('outro').style.opacity=vo; $('outro').style.display=vo>0?'block':'none';
  if(vo>0){['o1','o2','o3','o4'].forEach((id,i)=>{const a=14+i*.18,k=p(t,a,a+.7,eo);const el=$(id);el.style.opacity=k;
      el.style.transform=`translateY(${(1-k)*60}px) scale(${.94+.06*k+.015*p(t,15,20,x=>x)}) rotate(${[-1.5,1.2,1,-1.2][i]*k}deg)`;});
    const a1=rise($('t4a'),t,14.9,.8,30)*(1-p(t,16.8,17.3)); $('t4a').style.opacity=a1;
    const kb=p(t,17.2,18.0,eo); $('t4b').style.opacity=kb; $('t4b').style.transform=`translateY(${(1-kb)*30}px)`;
    const pk=p(t,17.7,18.4,eo); $('pill').style.transform=`scale(${.8+.2*pk+.02*Math.sin(t*5)*pk})`; $('pill').style.opacity=pk;}
  // soft white sparkle on intro->first card and end
  $('sparkle').style.opacity=Math.max(.35*(1-Math.abs(t-3)/.35)*(Math.abs(t-3)<.35),0)+p(t,19.5,20)*.0;
  $('stage').style.filter=t>19.4?`brightness(${1+p(t,19.4,20)*.0}) opacity(${1-p(t,19.4,20)})`:'none';
};
window.seek(0);
</script>
</body>
</html>
